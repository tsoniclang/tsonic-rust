[package]
name = "tsonic_node"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
brotli = "7"
flate2 = "1"
filetime = "0.2"
get_if_addrs = "0.5"
glob = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
rsa = { version = "0.9", features = ["sha2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tsonic_js = { path = "../tsonic_js" }
tsonic_runtime = { path = "../tsonic_runtime" }
